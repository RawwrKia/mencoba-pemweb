<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grafika Komputer - Semua Kelompok Warna</title>

<style>
.container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}
canvas{
    border:2px solid black;
}
</style>
</head>

<body>

<div class="container">
    <canvas id="canvasMerah" width="200" height="200"></canvas>
    <canvas id="canvasKuning" width="200" height="200"></canvas>
    <canvas id="canvasPink" width="200" height="200"></canvas>
    <canvas id="canvasOrange" width="200" height="200"></canvas>
    <canvas id="canvasHijau" width="200" height="200"></canvas>
    <canvas id="canvasBiru" width="200" height="200"></canvas>
    <canvas id="canvasCoklat" width="200" height="200"></canvas>
    <canvas id="canvasUngu" width="200" height="200"></canvas>
    <canvas id="canvasPutih" width="200" height="200"></canvas>
</div>

<script>

function gambarKelompok(idCanvas, daftarWarna){

    var canvasKita = document.querySelector("#"+idCanvas);
    var ctx = canvasKita.getContext("2d");
    var imageDataSaya = ctx.getImageData(0,0,canvasKita.width,canvasKita.height);

    function gbr_titik(imageDataSaya, x, y, r, g, b){
        var index = 4 * (x + (y * canvasKita.width));
        imageDataSaya.data[index] = r;
        imageDataSaya.data[index+1] = g;
        imageDataSaya.data[index+2] = b;
        imageDataSaya.data[index+3] = 255;
    }

    var index = 0;

    for(var baris=0; baris<3; baris++){
        for(var kolom=0; kolom<4; kolom++){

            if(index >= daftarWarna.length) break;

            var warna = daftarWarna[index].rgb;

            for(var j=0;j<60;j++){
                for(var i=0;i<50;i++){
                    gbr_titik(
                        imageDataSaya,
                        (kolom*50) + i,
                        (baris*60) + j,
                        warna[0],
                        warna[1],
                        warna[2]
                    );
                }
            }

            index++;
        }
    }

    ctx.putImageData(imageDataSaya, 0, 0);
}

// merah
var daftarWarnaMerah = [
{nama:"IndianRed", rgb:[205,92,92]},
{nama:"LightCoral", rgb:[240,128,128]},
{nama:"Salmon", rgb:[250,128,114]},
{nama:"DarkSalmon", rgb:[233,150,122]},
{nama:"LightSalmon", rgb:[255,160,122]},
{nama:"Crimson", rgb:[220,20,60]},
{nama:"FireBrick", rgb:[178,34,34]},
{nama:"DarkRed", rgb:[139,0,0]},
{nama:"Ruby", rgb:[224,17,95]},
{nama:"Cherry", rgb:[222,49,95]},
{nama:"Red", rgb:[255,0,0]},
{nama:"White", rgb:[255,255,255]}
];
gambarKelompok("canvasMerah", daftarWarnaMerah);

// kuning
var daftarWarnaKuning = [
{nama:"Yellow", rgb:[255,255,0]},
{nama:"LightYellow", rgb:[255,255,224]},

// hijau

</script>
</body>
</html>
